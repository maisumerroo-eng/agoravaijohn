<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0613">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Copiloto IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tela inicial -->
  <section id="inicio" class="inicio">
    <div class="inicio-box">
      <p class="tag">Assistente de jogo com IA</p>
      <h1>Copiloto<span>IA</span></h1>
      <p class="sub">Aponta a câmera pra TV. Teu parça lê a tela, solta dicas e curiosidades, e conversa contigo por voz. É só chamar: <b>"parça, …"</b></p>
      <button id="btnIniciar" class="btn-primario">Ligar câmera e microfone</button>
      <p class="aviso">Dica: apoia o celular num suporte, com a tela inteira enquadrada.</p>
    </div>
  </section>

  <!-- Câmera + HUD -->
  <main id="app" class="app" hidden>
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas" hidden></canvas>

    <header class="topo">
      <div id="status" class="status"><i></i><span>Pronto</span></div>
      <div class="topo-acoes">
        <button id="btnGuia" class="icone" aria-label="Abrir guia do jogo">📖</button>
        <button id="btnVoz" class="icone" aria-label="Ligar ou desligar voz" aria-pressed="true">🔊</button>
        <button id="btnPausa" class="icone" aria-label="Pausar">⏸</button>
        <button id="btnConfig" class="icone" aria-label="Configurações">⚙</button>
      </div>
    </header>

    <div class="mira" aria-hidden="true"></div>
    <figure class="miniatura"><img id="miniatura" alt="Última foto da tela enviada pra IA" hidden><figcaption>o que a IA viu</figcaption></figure>

    <section id="painel" class="painel" aria-live="polite">
      <div id="conversa" class="cards conversa" hidden></div>
      <div id="local" class="local">Aguardando primeira leitura…</div>
      <div id="cards" class="cards"></div>
    </section>

    <form id="formPergunta" class="pergunta">
      <button type="button" id="btnMic" class="btn-mic" aria-label="Falar pergunta" aria-pressed="false">🎤</button>
      <input id="inputPergunta" type="text" placeholder="Diz &quot;parça…&quot; ou digita" autocomplete="off" enterkeyhint="send">
      <button type="submit" class="btn-enviar" aria-label="Enviar pergunta">➤</button>
      <button type="button" id="btnAgora" class="btn-agora">Ler agora</button>
    </form>
  </main>

  <!-- Configurações -->
  <dialog id="config" class="config">
    <form method="dialog">
      <h2>Configurações</h2>
      <label>Chave grátis do Gemini (Google, sem cartão) — fica só neste celular
        <input id="cfgGemini" type="password" placeholder="Cole a chave do Google AI Studio" autocomplete="off">
        <small><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Pegar chave grátis no Google AI Studio</a></small>
      </label>
      <label class="linha"><input id="cfgVozIA" type="checkbox" checked> Voz de IA quase humana (Gemini). Desligado = voz do celular</label>
      <label>Voz do Parça
        <select id="cfgVozNome">
          <option value="Puck">Puck — animado (padrão)</option>
          <option value="Fenrir">Fenrir — empolgado</option>
          <option value="Orus">Orus — firme</option>
          <option value="Charon">Charon — calmo, explicativo</option>
          <option value="Kore">Kore — feminina, firme</option>
          <option value="Aoede">Aoede — feminina, leve</option>
          <option value="Leda">Leda — feminina, jovem</option>
          <option value="Zephyr">Zephyr — feminina, clara</option>
        </select>
      </label>
      <label>Velocidade da voz
        <select id="cfgVelocidade">
          <option value="0.95">Calma</option>
          <option value="1">Normal (mais clara)</option>
          <option value="1.1">Um pouco rápida</option>
          <option value="1.2">Rápida</option>
        </select>
      </label>
      <button type="button" id="btnTestarVoz" class="btn-secundario">▶ Testar voz</button>
      <label>Intervalo entre leituras
        <select id="cfgIntervalo">
          <option value="8">8 s (gasta mais)</option>
          <option value="15">15 s</option>
          <option value="30" selected>30 s</option>
          <option value="60">60 s</option>
          <option value="0">Só manual</option>
        </select>
      </label>
      <label>Foco
        <select id="cfgFoco">
          <option value="tudo">Tudo</option>
          <option value="missão e combate">Missão e combate</option>
          <option value="exploração e segredos">Exploração e segredos</option>
          <option value="dinheiro e progresso">Dinheiro e progresso</option>
          <option value="curiosidades e história real">Curiosidades</option>
        </select>
      </label>
      <label class="linha"><input id="cfgSpoilers" type="checkbox"> Permitir spoilers da história</label>
      <label class="linha"><input id="cfgPular" type="checkbox" checked> Pular frame se a tela não mudou</label>
      <label>Seu nome
        <input id="cfgNome" type="text" maxlength="30" autocomplete="off">
      </label>
      <label class="linha"><input id="cfgOuvir" type="checkbox"> Microfone sempre ouvindo (mãos-livres)</label>
      <label class="linha"><input id="cfgAtivacao" type="checkbox"> Só responder quando chamar "parça" (evita pegar o som do jogo)</label>
      <label>Chave própria da Anthropic (opcional — sem ela usa o crédito grátis da Vercel)
        <input id="cfgChave" type="password" placeholder="sk-ant-…" autocomplete="off">
      </label>
      <menu><button value="ok" class="btn-primario">Salvar</button></menu>
    </form>
  </dialog>

  <!-- Guia offline (banco de conhecimento) -->
  <dialog id="guia" class="config guia">
    <form method="dialog" class="guia-topo">
      <h2>Guia GTA VI</h2>
      <button class="icone" aria-label="Fechar guia">✕</button>
    </form>
    <input id="guiaBusca" type="search" placeholder="Buscar: Vice City, polícia, pesca…" autocomplete="off">
    <div id="guiaFiltros" class="filtros"></div>
    <div id="guiaLista" class="guia-lista"></div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
